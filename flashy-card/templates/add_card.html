{% extends "base.html" %}

{% block content %}
<div class="add-card-page">
    <div class="add-card-header">
        <h1>Add New Card</h1>
        <p>Create a new flashcard for {{ language_name }}</p>
    </div>

    <div class="add-card-form">
        <form method="POST" action="/api/cards/add">
            <input type="hidden" name="language_slug" value="{{ language_slug }}">

            <div class="form-group">
                <label for="type_id">Card Type: <span class="required">*</span></label>
                <select id="type_id" name="type_id" required>
                    <option value="">-- Select a card type --</option>
                    {% for card_type in card_types %}
                    <option value="{{ card_type.id }}">{{ card_type.type_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="target">Target Word/Phrase: <span class="required">*</span></label>
                <input type="text" id="target" name="target" required maxlength="1024" placeholder="Word or phrase in {{ language_name }}">
            </div>

            <div class="form-group">
                <label for="translation">Translation: <span class="required">*</span></label>
                <input type="text" id="translation" name="translation" required maxlength="2048" placeholder="Translation in your language">
            </div>

            <div class="form-group">
                <label for="hint">Hint (optional):</label>
                <input type="text" id="hint" name="hint" maxlength="2048" placeholder="A helpful hint for remembering">
            </div>

            <div class="form-group">
                <label for="examples">Examples (optional):</label>
                <textarea id="examples" name="examples" rows="4" placeholder="Example sentences using this word/phrase"></textarea>
            </div>

            <div class="form-group">
                <label for="additional_info">Additional Information (optional):</label>
                <textarea id="additional_info" name="additional_info" rows="3" placeholder="Grammar notes, conjugations, or other helpful information"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Create Card</button>
                <a href="/{{ language_slug }}/cards" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
