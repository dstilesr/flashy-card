services:
  postgres:
    image: postgres:18-alpine
    container_name: flashy-card-postgres
    environment:
      POSTGRES_DB: flashcards
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d flashcards"]
      interval: 10s
      timeout: 5s
      retries: 5

  flashy-card:
    container_name: flashy-card-app
    depends_on:
      - postgres
    build:
      context: "./flashy-card"
    environment:
      DATABASE_URL: "postgres://dev:dev@postgres/flashcards"
      RUST_LOG: "debug"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
